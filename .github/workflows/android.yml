name: Android APK

# Builds the bitwallet Android app on every push that touches it. Pushes to main also
# publish the APK to the "android-latest" release, linked from the landing page.
on:
  push:
    paths:
      - 'app/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Capacitor
        run: npm ci

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk bitwallet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bitwallet-apk
          path: bitwallet.apk

      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest \
            --title "bitwallet for Android" --latest \
            --notes "Download **bitwallet.apk** on your Android phone and open it to install (allow installs from your browser when asked). This release is rebuilt automatically from main."
          gh release upload android-latest bitwallet.apk --clobber
